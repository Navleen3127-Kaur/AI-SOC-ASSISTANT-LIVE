[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-analyst"
version = "1.0.0"
description = "AI-powered SOC analyst for Wazuh/Elasticsearch with MITRE ATT&CK mapping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "opensearch-py>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "attackcti>=0.4.0",
    "jinja2>=3.1.4",
    "rich>=13.9.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
soc-analyst = "soc_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soc_analyst = ["templates/*.j2"]
